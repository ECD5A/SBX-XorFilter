<svg xmlns="http://www.w3.org/2000/svg" width="980" height="260" viewBox="0 0 980 260" role="img" aria-labelledby="title desc">
  <title id="title">SBX XorFilter build and lookup flow</title>
  <desc id="desc">A compact old-terminal style diagram showing keys, pending buffer, finalize, XOR table, and hot lookup.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#080b0a"/>
      <stop offset="1" stop-color="#11160f"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .box { fill:#0d130f; stroke:#36ff68; stroke-width:1.4; rx:12; }
      .box2 { fill:#141209; stroke:#ffb000; stroke-width:1.4; rx:12; }
      .title { fill:#36ff68; font:700 24px Consolas, monospace; letter-spacing:1px; }
      .text { fill:#b7ffc7; font:15px Consolas, monospace; }
      .muted { fill:#8fa693; font:13px Consolas, monospace; }
      .arrow { stroke:#ffb000; stroke-width:2; fill:none; marker-end:url(#arrowhead); }
      .scan { fill:#00d9ff; font:13px Consolas, monospace; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ffb000"/>
    </marker>
  </defs>
  <rect width="980" height="260" fill="url(#bg)"/>
  <rect x="18" y="18" width="944" height="224" fill="none" stroke="#1e3524" stroke-width="1"/>
  <text x="34" y="52" class="title" filter="url(#glow)">SBX XorFilter</text>
  <text x="34" y="78" class="muted">static probabilistic lookup for 64-bit keys</text>

  <rect x="38" y="118" width="150" height="76" class="box"/>
  <text x="58" y="148" class="text">keys</text>
  <text x="58" y="171" class="muted">uint64 stream</text>

  <path d="M195 156 L252 156" class="arrow"/>

  <rect x="260" y="118" width="160" height="76" class="box"/>
  <text x="282" y="148" class="text">pending</text>
  <text x="282" y="171" class="muted">append model</text>

  <path d="M428 156 L485 156" class="arrow"/>

  <rect x="493" y="118" width="160" height="76" class="box2"/>
  <text x="515" y="148" class="text">finalize</text>
  <text x="515" y="171" class="muted">seed retry</text>

  <path d="M661 156 L718 156" class="arrow"/>

  <rect x="726" y="118" width="190" height="76" class="box"/>
  <text x="748" y="148" class="text">XOR table</text>
  <text x="748" y="171" class="muted">3 positions + fp16</text>

  <text x="38" y="222" class="scan">lookup(raw64) -> mix -> h0 ^ h1 ^ h2 -> fingerprint match</text>
  <text x="726" y="222" class="muted">MIT / C API / C++ implementation</text>
</svg>
